name: Build

on:
  push:
    branches: ['**']
    tags: ['[0-9]*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Ubuntu 24.04 has no SDL3 package, so we build SDL from source, with
          # the X11, Wayland and audio headers below.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libvorbis-dev libogg-dev libpng-dev libdumb1-dev libvpx-dev \
            libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            libxkbcommon-dev wayland-protocols libpulse-dev libasound2-dev \
            xvfb xauth libgl1-mesa-dri

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Play the opening of Out Of Order
        run: |
          packaging/get-out-of-order.sh ooo
          export HOME=$PWD/home SDL_AUDIO_DRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p "$HOME"
          # After 15 seconds, the engine must still be running, which means
          # that there was no fatal error.
          set +e
          timeout 15 xvfb-run -a -s "-screen 0 1280x1024x24" \
            build/sludge-engine -w -d1 ooo/usr/share/out-of-order/gamedata > engine.log 2>&1
          status=$?
          set -e
          tail -n 20 engine.log
          if [ $status -ne 124 ]; then
            echo "The engine exited early with status $status"
            exit 1
          fi

  devkit:
    name: DevKit (GTK 3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake pkg-config \
            libgtk-3-dev libepoxy-dev libpng-dev \
            xvfb xauth libgl1-mesa-dri libegl1 libegl-mesa0

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix="$PWD/dist"
          make -j"$(nproc)"
          make install

      - name: Test the drawing of the editor views
        run: LIBGL_ALWAYS_SOFTWARE=1 make -C GTK_Dev_Kit check

      - name: Keep the pictures of the failed view tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: devkit-view-test
          path: |
            GTK_Dev_Kit/*-actual.png
            GTK_Dev_Kit/*-difference.png
            GTK_Dev_Kit/*.log

      - name: Smoke-test the tools
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1
          # The compiler is headless and must start without a display.
          dist/bin/sludge-compiler --help
          # The editors are GUI applications: each one has to stay alive under a
          # virtual display. After 5 seconds it must still be running, which
          # means that it started without a fatal error.
          for app in sludge-floormaker sludge-zbuffermaker sludge-spritebankeditor \
                     sludge-translationeditor sludge-projectmanager; do
            log="$app.log"
            set +e
            timeout 5 xvfb-run -a -s "-screen 0 1280x1024x24" dist/bin/$app > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            if [ $status -ne 124 ]; then
              echo "$app exited early with status $status"
              exit 1
            fi
            if grep -E "CRITICAL|ERROR|Segmentation fault" "$log"; then
              echo "$app reported an error"
              exit 1
            fi
          done

  windows:
    name: Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-nasm
            make
            diffutils
            perl
            git
            zip

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSLUDGE_BUNDLED_DEPS=ON
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the executable
        run: packaging/windows/check-dlls.sh objdump build/sludge-engine.exe

      - name: Make the zips
        run: |
          packaging/get-out-of-order.sh ooo
          packaging/windows/make-zips.sh build/sludge-engine.exe ooo "$(packaging/version.sh)" x64 dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zips
          path: dist/*.zip
          if-no-files-found: error

  windows-devkit:
    name: DevKit (Windows)
    needs: windows
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            autoconf
            automake
            make
            zip
            unzip

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/
          make -j"$(nproc)"
          # On Windows, a folder named install would clash with INSTALL.
          make install DESTDIR="$PWD/devkit-install"

      # We put the engine from the OpenSLUDGE zip of the Windows job into the
      # Dev Kit, to run the games with.
      - uses: actions/download-artifact@v4
        with:
          name: windows-zips
          path: engine

      - name: Make the zip
        run: |
          unzip -q -j engine/OpenSLUDGE-*-windows-x64.zip OpenSLUDGE/OpenSLUDGE.exe -d engine
          packaging/windows/make-devkit-zip.sh devkit-install /ucrt64 engine/OpenSLUDGE.exe \
            "$(packaging/version.sh)" x64 dist

      - name: Start the tools from the zip
        run: |
          unzip -q dist/OpenSLUDGE-DevKit-*.zip -d unpacked
          cd "unpacked/OpenSLUDGE Dev Kit"
          # We leave the GTK of MSYS2 out of PATH and XDG_DATA_DIRS, so that
          # the tools can only use the DLLs, schemas and icons in the zip.
          run() { env -u XDG_DATA_DIRS PATH=/usr/bin "$@"; }
          run ./sludge-compiler.exe --help
          # Each editor has to stay alive for 10 seconds, which means that it
          # started without a fatal error.
          for app in sludge-floormaker sludge-zbuffermaker sludge-spritebankeditor \
                     sludge-translationeditor sludge-projectmanager; do
            set +e
            run timeout 10 ./$app.exe
            status=$?
            set -e
            if [ $status -ne 124 ]; then
              echo "$app exited early with status $status"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-devkit-zip
          path: dist/*.zip
          if-no-files-found: error

  windows-x86:
    name: Windows (32-bit, from Windows XP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-i686-win32 binutils-mingw-w64-i686 cmake ninja-build nasm zip

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSLUDGE_BUNDLED_DEPS=ON \
            -DSLUDGE_TESTS=OFF -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-i686.cmake
          cmake --build build

      - name: Check the executable
        run: |
          packaging/windows/check-dlls.sh i686-w64-mingw32-objdump build/sludge-engine.exe
          i686-w64-mingw32-objdump -p build/sludge-engine.exe | grep -E 'Major(OSystem|Subsystem)Version'
          python3 packaging/windows/check-xp-imports.py i686-w64-mingw32-objdump build/sludge-engine.exe reactos

      - name: Make the zips
        run: |
          packaging/get-out-of-order.sh ooo
          STRIP=i686-w64-mingw32-strip packaging/windows/make-zips.sh \
            build/sludge-engine.exe ooo "$(packaging/version.sh)" x86 dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86-zips
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            min_macos: '11.0'
          - arch: x86_64
            min_macos: '10.13'
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # We assemble the x86 SIMD code of libvpx with nasm.
        run: brew install nasm ninja

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSLUDGE_BUNDLED_DEPS=ON \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ matrix.min_macos }}
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check the executable
        run: |
          file build/sludge-engine
          otool -L build/sludge-engine
          vtool -show-build build/sludge-engine
          # We link dynamically to system libraries only.
          if otool -L build/sludge-engine | tail -n +2 | grep -v -E '^\s+(/usr/lib/|/System/Library/)'; then
            echo "Unexpected non-system library"
            exit 1
          fi
          # On the Apple Silicon runner, we run the Intel build with Rosetta.
          arch -${{ matrix.arch }} build/sludge-engine --help

      - uses: actions/upload-artifact@v4
        with:
          name: sludge-engine-macos-${{ matrix.arch }}
          path: build/sludge-engine
          if-no-files-found: error

  macos-package:
    name: macOS apps
    needs: macos
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: sludge-engine-macos-*
          path: engines

      - name: Make the universal executable
        run: |
          mkdir -p bin/arm64 bin/x86_64 bin/universal
          cp engines/sludge-engine-macos-arm64/sludge-engine bin/arm64/
          cp engines/sludge-engine-macos-x86_64/sludge-engine bin/x86_64/
          lipo -create -output bin/universal/sludge-engine bin/arm64/sludge-engine bin/x86_64/sludge-engine
          chmod +x bin/*/sludge-engine
          lipo -info bin/universal/sludge-engine

      - name: Get Out Of Order
        run: |
          packaging/get-out-of-order.sh ooo
          # When the player chooses Help, the game opens ooodoc/contents.html
          # in the folder that contains its data file.
          mkdir -p ooodoc
          cp ooo/usr/share/doc/out-of-order/*.html ooodoc/
          cp ooo/usr/share/doc/out-of-order/copyright ooodoc/LICENSE.txt
          packaging/macos/xpm-to-icns.py ooo/usr/share/pixmaps/out-of-order.xpm outoforder.icns

      - name: Set up code signing
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          identity=$(packaging/macos/set-up-signing.sh "$RUNNER_TEMP")
          echo "Signing as: $identity"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> $GITHUB_ENV

      - name: Make the apps
        run: |
          version=$(packaging/version.sh)
          echo "VERSION=$version" >> $GITHUB_ENV
          mkdir -p dist
          for variant in universal arm64 x86_64; do
            case $variant in
              universal) label=macOS-universal; min=10.13 ;;
              arm64) label=macOS-apple-silicon; min=11.0 ;;
              x86_64) label=macOS-intel; min=10.13 ;;
            esac

            out=stage/$variant/OpenSLUDGE
            mkdir -p "$out"
            packaging/macos/make-app.sh bin/$variant/sludge-engine "$out/OpenSLUDGE.app" \
              OpenSLUDGE org.opensludge.engine images/Sludge.icns $min
            packaging/macos/sign-app.sh "$out/OpenSLUDGE.app"
            cp packaging/macos/README-macOS.txt "$out/"

            out=stage/$variant/"Out Of Order"
            mkdir -p "$out"
            packaging/macos/make-app.sh bin/$variant/sludge-engine "$out/Out Of Order.app" \
              "Out Of Order" org.opensludge.outoforder outoforder.icns $min \
              ooo/usr/share/out-of-order/gamedata ooodoc packaging/out-of-order/controller.ini
            packaging/macos/sign-app.sh "$out/Out Of Order.app"
            cp -R ooodoc "$out/Documentation"
            cp packaging/macos/README-macOS.txt "$out/"

            (cd stage/$variant && ditto -c -k --keepParent OpenSLUDGE ../../dist/OpenSLUDGE-$version-$label.zip)
            (cd stage/$variant && ditto -c -k --keepParent "Out Of Order" ../../dist/OutOfOrder-$version-$label.zip)
          done
          ls -la dist

      - name: Notarise
        if: env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_API_KEY_P8_BASE64 != ''
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > $RUNNER_TEMP/api_key.p8
          for zip in dist/*.zip; do
            xcrun notarytool submit "$zip" --wait \
              --key $RUNNER_TEMP/api_key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          done
          # Staple the notarisation tickets to the apps, and zip them again.
          rm dist/*.zip
          for variant in universal arm64 x86_64; do
            case $variant in
              universal) label=macOS-universal ;;
              arm64) label=macOS-apple-silicon ;;
              x86_64) label=macOS-intel ;;
            esac
            xcrun stapler staple stage/$variant/OpenSLUDGE/OpenSLUDGE.app
            xcrun stapler staple "stage/$variant/Out Of Order/Out Of Order.app"
            (cd stage/$variant && ditto -c -k --keepParent OpenSLUDGE ../../dist/OpenSLUDGE-$VERSION-$label.zip)
            (cd stage/$variant && ditto -c -k --keepParent "Out Of Order" ../../dist/OutOfOrder-$VERSION-$label.zip)
          done

      - name: Check the apps
        run: |
          for app in stage/*/OpenSLUDGE/OpenSLUDGE.app "stage/universal/Out Of Order/Out Of Order.app"; do
            codesign --verify --strict --verbose=2 "$app"
            "$app/Contents/MacOS/sludge-engine" --help > /dev/null
          done
          lipo -info "stage/universal/Out Of Order/Out Of Order.app/Contents/MacOS/sludge-engine"
          spctl --assess --type execute --verbose "stage/universal/OpenSLUDGE/OpenSLUDGE.app" || \
            echo "(Gatekeeper only accepts notarised apps)"

      - name: Play the opening of Out Of Order
        run: |
          export HOME=$PWD/home
          mkdir -p "$HOME"
          # We start the engine in the app without a game file, as Finder
          # does, to test that we find the game inside the app. We run the
          # x86_64 app with Rosetta. We print "OpenGL version" after loading the
          # game and opening the window, so we look for it in the log. After
          # 15 seconds, the engine must still be running, which means that
          # there was no fatal error.
          for variant in universal x86_64; do
            engine="stage/$variant/Out Of Order/Out Of Order.app/Contents/MacOS/sludge-engine"
            "$engine" -w -d1 > engine-$variant.log 2>&1 &
            pid=$!
            sleep 15
            running=no
            if kill -0 $pid 2>/dev/null; then running=yes; kill $pid; fi
            tail -n 20 engine-$variant.log
            if [ $running != yes ]; then
              echo "The $variant engine stopped before 15 seconds"
              exit 1
            fi
            if ! grep -q "OpenGL version" engine-$variant.log; then
              echo "The $variant engine did not start the game"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-apps
          path: dist/*.zip
          if-no-files-found: error

  macos-devkit:
    name: DevKit (macOS)
    needs: macos
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      # The Homebrew libraries on this runner are for macOS 15 or later, so we
      # build the tools for the same versions.
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install autoconf automake pkgconf gtk+3 libepoxy libpng librsvg \
            adwaita-icon-theme dylibbundler

      - name: Build
        run: |
          ./autogen.sh
          ./configure --prefix=/
          make -j"$(sysctl -n hw.ncpu)"
          make install DESTDIR="$PWD/devkit-install"

      # We put the Apple Silicon engine of the macOS job into the Dev Kit, to
      # run the games with.
      - uses: actions/download-artifact@v4
        with:
          name: sludge-engine-macos-arm64
          path: engine

      - name: Set up code signing
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          identity=$(packaging/macos/set-up-signing.sh "$RUNNER_TEMP")
          echo "Signing as: $identity"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> $GITHUB_ENV

      - name: Make the apps
        id: apps
        run: |
          chmod +x engine/sludge-engine
          packaging/macos/make-app.sh engine/sludge-engine engine/OpenSLUDGE.app \
            OpenSLUDGE org.opensludge.engine images/Sludge.icns 11.0
          packaging/macos/sign-app.sh engine/OpenSLUDGE.app
          packaging/macos/make-devkit.sh devkit-install "$(brew --prefix)" engine/OpenSLUDGE.app \
            "$MACOSX_DEPLOYMENT_TARGET" stage

      # In the steps that test the apps, we report every problem that we find
      # before we fail.
      - name: Check the apps
        run: |
          cd "stage/OpenSLUDGE Dev Kit"
          failed=no
          for app in *.app; do
            codesign --verify --strict "$app" || { echo "::error::The signature of $app is not valid"; failed=yes; }
          done
          # Every library must be one in the apps or one of macOS, and no
          # program or library may require a later version of macOS than the
          # apps.
          while IFS= read -r -d '' file; do
            case "$(file -b "$file")" in *Mach-O*) ;; *) continue ;; esac
            if otool -L "$file" | tail -n +2 | grep -v -E '^\s+(@executable_path/|/usr/lib/|/System/Library/)'; then
              echo "::error::$file uses libraries from outside the apps"
              failed=yes
            fi
            minos=$(otool -l "$file" | awk '/cmd LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')
            latest=$(printf '%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n 1)
            if [ -n "$minos" ] && [ "$latest" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$file requires macOS $minos"
              failed=yes
            fi
          done < <(find . -type f -print0)
          grep -v '^#' "SLUDGE Floor Maker.app/Contents/Resources/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache"
          du -sh *.app
          [ $failed = no ]

      - name: Notarise
        if: env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_API_KEY_P8_BASE64 != ''
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > $RUNNER_TEMP/api_key.p8
          (cd stage && ditto -c -k --keepParent "OpenSLUDGE Dev Kit" ../notarise.zip)
          xcrun notarytool submit notarise.zip --wait \
            --key $RUNNER_TEMP/api_key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          for app in "stage/OpenSLUDGE Dev Kit"/*.app; do xcrun stapler staple "$app"; done

      - name: Make the zip
        id: zip
        if: always() && steps.apps.outcome == 'success'
        run: |
          mkdir -p dist
          (cd stage && ditto -c -k --keepParent "OpenSLUDGE Dev Kit" \
            ../dist/OpenSLUDGE-DevKit-$(../packaging/version.sh)-macOS-apple-silicon.zip)
          ls -la dist
          ditto -x -k dist/OpenSLUDGE-DevKit-*.zip unpacked
          mkdir -p screenshots

      # We move Homebrew away, so that the tools can only use the libraries,
      # loaders, schemas and icons in the apps.
      - name: Move Homebrew away
        if: always() && steps.zip.outcome == 'success'
        run: sudo mv "$(brew --prefix)" "$(brew --prefix)-away"

      - name: Start the tools from the zip
        if: always() && steps.zip.outcome == 'success'
        run: |
          cd "unpacked/OpenSLUDGE Dev Kit"
          failed=no
          "SLUDGE Project Manager.app/Contents/MacOS/sludge-compiler" --help > /dev/null ||
            { echo "::error::sludge-compiler did not run"; failed=yes; }
          # Each tool has to stay alive for 10 seconds without printing a
          # warning, which means that it started without problems. We open a
          # file of VerbCoin in each editor, to see in the screenshots that
          # the editor draws its view.
          verbcoin="$GITHUB_WORKSPACE/doc/ExampleProjects/VerbCoin"
          for app in "SLUDGE Project Manager:" "SLUDGE Floor Maker:outside/room.flo" \
                     "SLUDGE Sprite Bank Editor:ego/alien.duc" "SLUDGE Z-Buffer Maker:outside/room.zbu" \
                     "SLUDGE Translation Editor:german.tra"; do
            file=${app#*:}
            app=${app%%:*}
            executable=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$app.app/Contents/Info.plist")
            log="$GITHUB_WORKSPACE/screenshots/$executable.log"
            "$app.app/Contents/MacOS/$executable" ${file:+"$verbcoin/$file"} > "$log" 2>&1 &
            pid=$!
            sleep 10
            screencapture -x "$GITHUB_WORKSPACE/screenshots/$executable.png" || true
            if kill -0 $pid 2>/dev/null; then
              kill $pid
            else
              echo "::error::$app stopped before 10 seconds"
              failed=yes
            fi
            cat "$log"
            if grep -q -E "CRITICAL|WARNING|ERROR" "$log"; then
              echo "::error::$app printed a warning or an error"
              failed=yes
              # With G_DEBUG=fatal-warnings, the first warning stops the tool,
              # and the crash report shows where we were when GTK warned.
              G_DEBUG=fatal-warnings "$app.app/Contents/MacOS/$executable" ${file:+"$verbcoin/$file"} > /dev/null 2>&1 &
              pid=$!
              sleep 10
              kill $pid 2>/dev/null || true
              "$GITHUB_WORKSPACE/.github/scripts/print-crash-report.py" "$executable"
            fi
          done
          # The folder where we keep the settings, for README-DevKit.txt.
          ls -d ~/.config/sludge-devkit ~/Library/Application\ Support/sludge-devkit 2>/dev/null || true
          [ $failed = no ]

      - name: Open a floor and run a game with open
        if: always() && steps.zip.outcome == 'success'
        run: |
          kit="$PWD/unpacked/OpenSLUDGE Dev Kit"
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          for app in "$kit"/*.app; do "$lsregister" -f "$app"; done
          failed=no
          cp -R doc/ExampleProjects/VerbCoin verbcoin
          "$kit/SLUDGE Project Manager.app/Contents/MacOS/sludge-compiler" verbcoin/VerbCoin.slp || true
          game="$PWD/verbcoin/Verb coin example.slg"
          if [ ! -f "$game" ]; then
            echo "::error::The compiler did not make the game file"
            ls verbcoin
            .github/scripts/print-crash-report.py sludge-compiler
            failed=yes
          fi
          # We start the apps with open, as the project manager does, and each
          # one has to be running after 10 seconds.
          start () {
            local name=$1 process=$2 picture=$3
            shift 3
            if ! open -n -a "$name" --args "$@"; then
              echo "::error::open did not start $name"
              failed=yes
              return
            fi
            sleep 10
            screencapture -x "screenshots/$picture.png" || true
            if ! pgrep -f "$process" > /dev/null; then
              echo "::error::$name stopped before 10 seconds"
              failed=yes
            fi
            pkill -f "$process" || true
          }
          start "SLUDGE Floor Maker" sludge-floormaker open-floor "$PWD/verbcoin/outside/room.flo"
          start "SLUDGE Sprite Bank Editor" sludge-spritebankeditor open-without-file
          start OpenSLUDGE sludge-engine run-game "$game"
          [ $failed = no ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-devkit-screenshots
          path: screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: macos-devkit-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, windows-devkit, windows-x86, macos-package, macos-devkit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-apps
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-zips
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86-zips
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-devkit-zip
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: macos-devkit-zip
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF#refs/tags/}
          prerelease=
          if [[ "$tag" == *-* ]]; then prerelease=--prerelease; fi
          ls -la dist
          gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "OpenSLUDGE $tag" --notes-file packaging/RELEASE_NOTES.md $prerelease
